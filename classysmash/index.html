<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Abrindo Classy Smash no iFood</title>
  <style>
    :root{color-scheme:light dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111;color:#fff;padding:24px}
    main{width:min(520px,100%);text-align:center}
    h1{font-size:28px;margin:0 0 10px}
    p{opacity:.78;line-height:1.45;margin:0 0 22px}
    a{display:block;text-decoration:none;font-weight:800;border-radius:16px;padding:17px 20px;margin:12px 0}
    .primary{background:#ea1d2c;color:#fff}
    .secondary{border:1px solid #444;color:#fff}
    small{display:block;opacity:.55;margin-top:18px}
  </style>
</head>
<body>
<main>
  <h1>Classy Smash</h1>
  <p>Estamos abrindo a loja no aplicativo do iFood.</p>
  <a id="openApp" class="primary" href="ifood://restaurant/2ae7cef0-b4d9-480e-93e1-140d11256688">ABRIR NO IFOOD</a>
  <a class="secondary" href="https://www.ifood.com.br/delivery/vitoria-es/classy-smash-hamburgueria-republica/2ae7cef0-b4d9-480e-93e1-140d11256688">Continuar pelo navegador</a>
  <small>Se o aplicativo não abrir automaticamente, toque em “ABRIR NO IFOOD”.</small>
</main>
<script>
(() => {
  const app = 'ifood://restaurant/2ae7cef0-b4d9-480e-93e1-140d11256688';
  const web = 'https://www.ifood.com.br/delivery/vitoria-es/classy-smash-hamburgueria-republica/2ae7cef0-b4d9-480e-93e1-140d11256688';
  const ua = navigator.userAgent || '';
  const mobile = /Android|iPhone|iPad|iPod/i.test(ua);
  let fallback;

  function tryApp() {
    if (!mobile) {
      location.replace(web);
      return;
    }
    const started = Date.now();
    location.href = app;
    fallback = setTimeout(() => {
      if (document.visibilityState === 'visible' && Date.now() - started < 4000) {
        location.replace(web);
      }
    }, 1800);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && fallback) clearTimeout(fallback);
  });

  document.getElementById('openApp').addEventListener('click', (e) => {
    e.preventDefault();
    tryApp();
  });

  setTimeout(tryApp, 250);
})();
</script>
</body>
</html>
