<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Abrindo Classy Smash no iFood</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111;color:#fff;padding:24px}main{width:min(520px,100%);text-align:center}h1{font-size:28px;margin:0 0 10px}p{opacity:.78;line-height:1.45;margin:0 0 22px}a{display:block;text-decoration:none;font-weight:800;border-radius:16px;padding:17px 20px;margin:12px 0;background:#ea1d2c;color:#fff}small{display:block;opacity:.55;margin-top:18px}</style>
</head><body><main><h1>Classy Smash</h1><p>Abrindo a loja no iFood.</p><a id="go" href="https://www.ifood.com.br/delivery/vitoria-es/classy-smash-hamburgueria-republica/2ae7cef0-b4d9-480e-93e1-140d11256688">ABRIR NO IFOOD</a><small>Se o redirecionamento automático não acontecer, toque no botão.</small></main>
<script>
const NS='mktblinks-classysmash-v1';
const target='https://www.ifood.com.br/delivery/vitoria-es/classy-smash-hamburgueria-republica/2ae7cef0-b4d9-480e-93e1-140d11256688';
const day=new Date().toISOString().slice(0,10), q=new URLSearchParams(location.search), ref=(document.referrer||'').toLowerCase(), ua=navigator.userAgent||'';
function hit(key){const i=new Image();i.referrerPolicy='no-referrer';i.src='https://abacus.jasoncameron.dev/hit/'+NS+'/'+encodeURIComponent(key)+'?r='+Date.now()+Math.random();}
function source(){const u=(q.get('utm_source')||'').toLowerCase();if(u.includes('meta')||q.has('fbclid'))return'meta';if(u.includes('instagram')||ref.includes('instagram'))return'instagram';if(u.includes('facebook')||ref.includes('facebook'))return'facebook';if(u.includes('google')||q.has('gclid')||ref.includes('google'))return'google';if(u.includes('whatsapp')||ref.includes('whatsapp'))return'whatsapp';return ref?'other':'direct';}
function device(){if(/iPhone|iPad|iPod/i.test(ua))return'iphone';if(/Android/i.test(ua))return'android';return'desktop';}
function campaign(){return q.has('utm_campaign')||q.has('utm_source')||q.has('fbclid')||q.has('gclid')||q.has('ttclid');}
hit('loads-total');hit('loads-'+day);hit('source-'+source());hit('device-'+device());if(campaign()){hit('campaign-total');hit('campaign-'+day);}
let sent=false;function go(){if(sent)return;sent=true;hit('sends-total');hit('sends-'+day);setTimeout(()=>location.replace(target),220);}
document.getElementById('go').addEventListener('click',e=>{e.preventDefault();go();});setTimeout(go,850);
</script></body></html>
