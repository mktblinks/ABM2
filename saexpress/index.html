<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Abrindo SA Express no iFood</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111;color:#fff;padding:24px}
    main{width:min(520px,100%);text-align:center}
    h1{font-size:28px;margin:0 0 10px}
    p{opacity:.78;line-height:1.45;margin:0 0 22px}
    a{display:block;text-decoration:none;font-weight:800;border-radius:16px;padding:17px 20px;margin:12px 0}
    .primary{background:#ea1d2c;color:#fff}
    small{display:block;opacity:.55;margin-top:18px}
  </style>
</head>
<body>
<main>
  <h1>SA Express</h1>
  <p>Abrindo a loja no iFood.</p>
  <a id="go" class="primary" href="https://www.ifood.com.br/delivery/link-cardapio/sitemercado/b15ed830-af17-4869-90a4-dfe155e153f3">ABRIR NO IFOOD</a>
  <small>Se o redirecionamento automático não acontecer, toque no botão.</small>
</main>
<script>
  const target = 'https://www.ifood.com.br/delivery/link-cardapio/sitemercado/b15ed830-af17-4869-90a4-dfe155e153f3';
  setTimeout(() => { window.location.replace(target); }, 250);
</script>
</body>
</html>
